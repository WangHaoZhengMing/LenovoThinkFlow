[package]
name = "thinkflow-cli"
version = "1.0.1"
edition = "2021"
description = "Userland CLI & real-time telemetry TUI monitor for LenovoThinkFlow EC Fan/Thermal Driver"

[[bin]]
name = "thinkflow"
path = "src/main.rs"

[dependencies]
thinkflow-core = { path = "../rust-core" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
